name: Test / Component Tests

permissions:
  contents: read

# Regular CI runs the component tests in docs.yml; this workflow is for manual runs only.
on:
  workflow_dispatch:

jobs:
  run-comp-tests:
    permissions:
      contents: read
      # Allows bazel.yml to prune replaced cache generations once it supports this.
      actions: write
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    with:
      test-targets: //score/...
      bazel-configs: x86_64-linux
      apt-packages: fakechroot
      cache-key: comp-tests
      artifact-name: tests-report
