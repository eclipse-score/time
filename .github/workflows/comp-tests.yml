name: Test / Component Tests

permissions:
  contents: read

# Regular CI runs the component tests in docs.yml; this workflow is for manual runs only.
on:
  workflow_dispatch:

jobs:
  run-comp-tests:
    uses: eclipse-score/cicd-workflows/.github/workflows/tests.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      contents: read
      pull-requests: read
    with:
      bazel-target: 'test --config=x86_64-linux //score/...'
      upload-name: 'tests-report'
      packages: 'fakechroot'
