name: Test / Code Coverage (>=85)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

jobs:
  code-coverage:
    permissions:
      contents: read
      # Allows bazel.yml to prune replaced cache generations once it supports this.
      actions: write
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    with:
      test-targets: //score/...
      test-command: coverage
      bazel-configs: llvm_cov
      test-args: --build_tests_only
      coverage-threshold: 85
      coverage-justifications: tools/coverage/coverage_justifications.yaml
      cache-key: code-coverage
      retention-days: 10
