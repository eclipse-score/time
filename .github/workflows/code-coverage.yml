name: Test / Code Coverage (>=85)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

jobs:
  code-coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Bazel
        uses: eclipse-score/cicd-actions/setup-bazel-cache@212bbf86267e9381da9d2daf962d12f6feafbc90 # v0.0.2
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}

      - name: Run coverage (LLVM source-based, @score_tooling//coverage)
        run: |
          set -euo pipefail
          bazel coverage --lockfile_mode=error --config=llvm_cov \
            //score/... --build_tests_only

      - name: Generate coverage report and enforce threshold
        env:
          COVERAGE_THRESHOLD: "85"
        run: |
          set -euo pipefail
          bazel run --lockfile_mode=error @score_tooling//coverage:generate_coverage_html -- \
            --testlogs-subdir score \
            --archive-dir coverage_artifact \
            --yaml tools/coverage/coverage_justifications.yaml

      # upload-artifact zips its input itself; the script assembles an
      # unzipped directory (--archive-dir) to avoid a zip inside a zip.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_coverage_report_cpp
          path: coverage_artifact
          retention-days: 10
