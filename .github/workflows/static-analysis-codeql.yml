name: QA / Static Analysis CodeQL

permissions:
  contents: read

# The event name is part of the group, so that the nightly ASIL run of `main` and the
# QM run of a `push` to `main` (same ref, but different jobs and categories) do not
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  # Nightly ASIL analysis of `main`, Linux only: the QNX analysis needs the QNX SDP
  # license and is not ready yet (see the `qnx-asil` job below).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run-qnx:
        description: Also run the QNX analysis (needs the SCORE_QNX_* secrets, QNX is not ready yet)
        type: boolean
        default: false

jobs:
  # Pull requests, `main` (push) and manual runs: fast QM preset. One job per
  # (preset, platform) pair, because `uses:` cannot be computed and the Code Scanning
  # category has to match the preset: static-analysis-codeql/<platform>/<preset>.
  # QM also runs on `main`, so PR results are diffed against a QM baseline.
  linux-qm:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Pinned by commit SHA (branch `feat/static-analysis-codeql` of the
    # etas-contrib fork, not merged upstream yet). Once the workflow is released
    # switch to `eclipse-score/cicd-workflows@<sha> # <tag>` like build-qnx.yml.
    uses: etas-contrib/score_cicd-workflows/.github/workflows/static-analysis-codeql.yml@2571edd13f5b981e11f7626fcb1f173ad5be8223 # feat/static-analysis-codeql
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      sca-target: //tools/codeql:sca_linux
      safety-level: QM
      category: static-analysis-codeql/linux/qm

  # Nightly run only: full ASIL preset incl. MISRA C++.
  linux-asil:
    if: github.event_name == 'schedule'
    uses: etas-contrib/score_cicd-workflows/.github/workflows/static-analysis-codeql.yml@2571edd13f5b981e11f7626fcb1f173ad5be8223 # feat/static-analysis-codeql
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      sca-target: //tools/codeql:sca_linux
      safety-level: ASIL
      category: static-analysis-codeql/linux/asil

  # QNX analysis needs the QNX SDP license and is not ready yet: it never runs
  # automatically, only when `run-qnx` is set on a manual run (and the SCORE_QNX_*
  # repository secrets exist).
  qnx-asil:
    if: github.event_name == 'workflow_dispatch' && inputs.run-qnx
    uses: etas-contrib/score_cicd-workflows/.github/workflows/static-analysis-codeql.yml@2571edd13f5b981e11f7626fcb1f173ad5be8223 # feat/static-analysis-codeql
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    with:
      sca-target: //tools/codeql:sca_qnx
      platform: qnx
      safety-level: ASIL
      category: static-analysis-codeql/qnx/asil
    secrets:
      score-qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      score-qnx-user: ${{ secrets.SCORE_QNX_USER }}
      score-qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
