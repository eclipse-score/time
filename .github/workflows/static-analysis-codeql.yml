name: QA / Static Analysis CodeQL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  # The nightly run (`schedule: - cron: "0 2 * * *"`) is disabled until the QNX
  # analysis is ready: the QNX SDP license and secrets are not set up yet, so the
  # nightly run (ASIL preset incl. QNX) would fail. Re-enable the `schedule`
  # trigger together with the `qnx` job below once QNX is verified.
  workflow_dispatch:

jobs:
  linux:
    # Pinned by commit SHA (branch `feat/static-analysis-codeql` of the
    # etas-contrib fork, not merged upstream yet). Once the workflow is released
    # switch to `eclipse-score/cicd-workflows@<sha> # <tag>` like build-qnx.yml.
    uses: etas-contrib/score_cicd-workflows/.github/workflows/static-analysis-codeql.yml@2571edd13f5b981e11f7626fcb1f173ad5be8223 # feat/static-analysis-codeql
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      sca-target: //tools/codeql:sca_linux
      # PRs: fast QM preset; main / manual run: full ASIL preset incl. MISRA C++.
      # The category is constant per job so PR and main alerts share a baseline.
      safety-level: ${{ github.event_name == 'pull_request' && 'QM' || 'ASIL' }}
      category: static-analysis-codeql/linux

  # QNX analysis needs the QNX SDP license; it only runs on demand for now (the
  # nightly trigger is disabled, see the `on:` block above) and requires the
  # SCORE_QNX_* repository secrets.
  qnx:
    if: github.event_name == 'workflow_dispatch'
    uses: etas-contrib/score_cicd-workflows/.github/workflows/static-analysis-codeql.yml@2571edd13f5b981e11f7626fcb1f173ad5be8223 # feat/static-analysis-codeql
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    with:
      sca-target: //tools/codeql:sca_qnx
      platform: qnx
      category: static-analysis-codeql/qnx
    secrets:
      score-qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      score-qnx-user: ${{ secrets.SCORE_QNX_USER }}
      score-qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
