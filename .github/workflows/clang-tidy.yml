name: QA / Clang-Tidy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

jobs:
  clang-tidy:
    # Pinned to ubuntu-24.04 — matches the LLVM 19 toolchain from toolchains_llvm.
    runs-on: ubuntu-24.04
    steps:
      - uses: eclipse-score/more-disk-space@6a3b48901846bf7f8cc985925157d71a8973e61f # v1
        with:
          level: 4

      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Bazel
        uses: eclipse-score/cicd-actions/setup-bazel-cache@212bbf86267e9381da9d2daf962d12f6feafbc90 # v0.0.2
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}

      - name: Run clang-tidy
        # continue-on-error is required: bazel exits non-zero when violations exist.
        # Remove once https://github.com/eclipse-score/time/issues/111 is resolved.
        continue-on-error: true
        run: bazel test --keep_going --config=clang-tidy //score/... 2>&1 | tee clang_tidy.log

      - name: Collect findings
        if: always()
        run: |
          find -L bazel-bin -name "*.AspectRulesLintClangTidy.out" 2>/dev/null \
            | xargs cat 2>/dev/null > clang_tidy_findings.txt || true

      - name: Check violation baseline
        # Scoped to score/time_daemon/ (#77): the repo-wide baseline no longer means much once
        # the S-CORE check set actually runs everywhere — score/time, score/time_slave and
        # score/ts_client have their own pre-existing findings tracked under #76/#78/#79.
        # Remove this step once https://github.com/eclipse-score/time/issues/111 is resolved.
        if: always()
        run: |
          BASELINE=0
          COUNT=$(grep -cE "score/time_daemon/[^:]*:[0-9]+:[0-9]+: (warning|error):" clang_tidy_findings.txt 2>/dev/null || true)
          COUNT=${COUNT:-0}
          echo "Clang-tidy violations in score/time_daemon/: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Clang-tidy violations in score/time_daemon/ grew: $COUNT > baseline $BASELINE. Fix new violations before merging."
            exit 1
          fi

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-findings-${{ github.run_id }}
          path: |
            clang_tidy.log
            clang_tidy_findings.txt
          retention-days: 7
