name: QA / CodeQL

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 2 * * *" # Nightly at 2 AM UTC
  workflow_dispatch:

jobs:
  codeql:
    name: MISRA C++:2023 analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: eclipse-score/more-disk-space@6a3b48901846bf7f8cc985925157d71a8973e61f # v1
        with:
          level: 4

      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-codeql
          repository-cache: true
          cache-save: true

      - name: Run MISRA C++:2023 analysis
        run: |
          bazel run //tools/static_analysis:codeql_lint -- \
            --output-dir ${{ runner.temp }}/codeql-results \
            --output-prefix codeql-time \
            --target //score/...

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/codeql-results/codeql-time.sarif

      - name: Upload compliance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-compliance-reports
          path: ${{ runner.temp }}/codeql-results/analysis_reports/
