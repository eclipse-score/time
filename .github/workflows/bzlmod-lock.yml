# Enforces MODULE.bazel.lock versioning and CI drift check as required by
# https://github.com/eclipse-score/score/issues/2628
name: Process / Bzlmod Lock Check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

jobs:
  bzlmod-lock:
    uses: eclipse-score/cicd-workflows/.github/workflows/bzlmod-lock-check.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    with:
      working-directory: .
