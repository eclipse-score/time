name: Build / Linux

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
jobs:
  build:
    permissions:
      contents: read
      # Allows bazel.yml to prune replaced cache generations once it supports this.
      actions: write
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    strategy:
      matrix:
        config: [x86_64-linux, arm64-linux]
    with:
      build-targets: //score/... //examples/...
      bazel-configs: ${{ matrix.config }}
      build-args: --keep_going --verbose_failures
      cache-key: build-${{ matrix.config }}

  # Public C++ API surface gate (see tools/api_surface/README.md). Fails on any
  # difference against the committed lock files; never regenerates them.
  api-surface:
    permissions:
      contents: read
      # Allows bazel.yml to prune replaced cache generations once it supports this.
      actions: write
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    with:
      test-targets: //:api_surface_tests
      bazel-configs: x86_64-linux
      test-args: --verbose_failures
      cache-key: api-surface
