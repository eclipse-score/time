name: Build / Linux

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [x86_64-linux, arm64-linux]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
      - name: Setup Bazel
        uses: eclipse-score/cicd-actions/setup-bazel-cache@212bbf86267e9381da9d2daf962d12f6feafbc90 # v0.0.2
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}-${{ matrix.config }}

      - name: Build with Bazel
        run: |
          bazel build --keep_going --verbose_failures --config ${{ matrix.config }} //score/... //examples/...
